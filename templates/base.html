<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasks — Material Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/material.css') }}" />
  </head>
  <body>
    <header class="top-app-bar">
      <div class="top-bar-inner">
        <a href="/home" class="brand-section">
          <div class="brand-icon-box">
            <span class="material-symbols-rounded filled">task_alt</span>
          </div>
          <div>
            <span class="brand-title">Tasks</span>
            <span class="brand-badge">Material</span>
          </div>
        </a>

        <nav class="nav-links">
          <a href="/home" class="nav-item">
            <span class="material-symbols-rounded">checklist</span>
            <span>Tasks</span>
          </a>
          <a href="/add" class="nav-item">
            <span class="material-symbols-rounded">add_circle</span>
            <span>New Task</span>
          </a>
          <a href="/logout" class="nav-item" id="logout">
            <span class="material-symbols-rounded">logout</span>
            <span>Logout</span>
          </a>
        </nav>
      </div>
    </header>

    <main>
      {% block main %}{% endblock %}
    </main>

    <footer class="app-footer">
      <div class="footer-inner">
        <div class="footer-brand">
          <span class="material-symbols-rounded" style="font-size: 1.1rem; color: var(--md-sys-color-primary);">verified</span>
          <span>Material Workspace</span>
        </div>
        <div>Clarity, focus, and purposeful motion.</div>
      </div>
    </footer>
  </body>
</html>
